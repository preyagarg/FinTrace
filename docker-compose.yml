# The database is Amazon RDS for MySQL 8.0 (not a container). See README "Deploy with Docker".
services:
  app:
    build: ./fintrace
    environment:
      MYSQL_HOST: ${MYSQL_HOST:?set MYSQL_HOST (RDS endpoint) in .env}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DB: ${MYSQL_DB:-fintrace}
      # RDS CA bundle baked into the image; set empty in .env to disable TLS (not recommended)
      MYSQL_SSL_CA: ${MYSQL_SSL_CA-/etc/ssl/certs/rds-global-bundle.pem}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

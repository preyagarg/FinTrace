<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinTrace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border-radius: 16px;
            border: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .login-card .card-body {
            padding: 2.5rem;
        }
        .brand-text {
            color: #00d4ff;
            font-weight: 700;
        }
        .subtitle {
            color: #8899aa;
            font-size: 0.9rem;
        }
        .form-control:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 0.2rem rgba(0,212,255,0.25);
        }
        .input-group-text {
            background: #f8f9fa;
            cursor: pointer;
        }
        .btn-login {
            background: linear-gradient(135deg, #00b894 0%, #00d4ff 100%);
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            color: white;
            transition: all 0.3s;
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,212,255,0.4);
        }
        .btn-login:disabled {
            opacity: 0.7;
        }
        a {
            color: #00d4ff;
            text-decoration: none;
        }
        a:hover {
            color: #00b894;
        }
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center w-100">
            <div class="col-auto">
                <div class="card login-card">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="mb-3">
                                <i class="bi bi-bank" style="font-size: 3rem; color: #00d4ff;"></i>
                            </div>
                            <h3 class="fw-bold mb-1 brand-text">FinTrace</h3>
                            <p class="subtitle">Financial Audit System</p>
                        </div>
                        <form id="login-form">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-envelope text-muted"></i>
                                    </span>
                                    <input type="email" class="form-control border-start-0" id="login-email" required 
                                           placeholder="Enter your email">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-lock text-muted"></i>
                                    </span>
                                    <input type="password" class="form-control border-start-0" id="login-password" required
                                           placeholder="Enter your password">
                                    <span class="input-group-text bg-light border-start-0" onclick="togglePassword()">
                                        <i class="bi bi-eye text-muted" id="toggle-icon"></i>
                                    </span>
                                </div>
                            </div>
                            <div id="login-message" class="mb-3"></div>
                            <button type="submit" class="btn btn-login w-100" id="login-btn">
                                <span class="btn-text">Sign In</span>
                                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            </button>
                        </form>
                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted mb-0">Don't have an account? <a href="/register-page" class="fw-semibold">Register here</a></p>
                        </div>
                    </div>
                    <div class="card-footer text-center bg-light border-0 py-3" style="border-radius: 0 0 16px 16px;">
                        <small class="text-muted">Demo: rahul@gmail.com / password123</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', function() {
            const userId = localStorage.getItem('user_id');
            if (userId) {
                const role = localStorage.getItem('role');
                if (role === 'admin') {
                    window.location.href = '/admin-dashboard';
                } else {
                    window.location.href = '/user-dashboard';
                }
            }
        });

        function togglePassword() {
            const passwordInput = document.getElementById('login-password');
            const toggleIcon = document.getElementById('toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye');
                toggleIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash');
                toggleIcon.classList.add('bi-eye');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const messageDiv = document.getElementById('login-message');
            const loginBtn = document.getElementById('login-btn');
            const btnText = loginBtn.querySelector('.btn-text');
            const spinner = loginBtn.querySelector('.spinner-border');
            
            // Show loading state
            loginBtn.disabled = true;
            btnText.textContent = 'Signing In...';
            spinner.classList.remove('d-none');
            messageDiv.innerHTML = '';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Save to localStorage
                    localStorage.setItem('user_id', result.user.id);
                    localStorage.setItem('role', result.user.role);
                    localStorage.setItem('full_name', result.user.name);
                    localStorage.setItem('account_id', result.user.account_id || '');
                    localStorage.setItem('email', result.user.email || '');
                    
                    messageDiv.innerHTML = '<div class="alert alert-success alert-dismissible fade show">Login successful! Redirecting...<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
                    
                    setTimeout(function() {
                        if (result.user.role === 'admin') {
                            window.location.href = '/admin-dashboard';
                        } else {
                            window.location.href = '/user-dashboard';
                        }
                    }, 1000);
                } else {
                    messageDiv.innerHTML = '<div class="alert alert-danger alert-dismissible fade show">' + (result.error || 'Invalid email or password') + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="alert alert-danger alert-dismissible fade show">Connection error. Please try again.<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
            } finally {
                // Reset button state
                loginBtn.disabled = false;
                btnText.textContent = 'Sign In';
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>

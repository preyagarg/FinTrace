<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FinTrace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .register-card {
            max-width: 500px;
            width: 100%;
            border-radius: 16px;
            border: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .register-card .card-body {
            padding: 2.5rem;
        }
        .brand-text {
            color: #198754;
            font-weight: 700;
        }
        .subtitle {
            color: #8899aa;
            font-size: 0.9rem;
        }
        .section-title {
            color: #495057;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e9ecef;
        }
        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.2rem rgba(25,135,84,0.25);
        }
        .input-group-text {
            background: #f8f9fa;
            cursor: pointer;
        }
        .btn-register {
            background: linear-gradient(135deg, #198754 0%, #20c997 100%);
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            color: white;
            transition: all 0.3s;
        }
        .btn-register:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(25,135,84,0.4);
        }
        .btn-register:disabled {
            opacity: 0.7;
        }
        a {
            color: #198754;
            text-decoration: none;
        }
        a:hover {
            color: #146c43;
        }
        .form-section {
            margin-bottom: 2rem;
        }
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center w-100">
            <div class="col-auto">
                <div class="card register-card">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="mb-3">
                                <i class="bi bi-person-plus" style="font-size: 3rem; color: #198754;"></i>
                            </div>
                            <h3 class="fw-bold mb-1 brand-text">Open Your Account</h3>
                            <p class="subtitle">Join FinTrace Today</p>
                        </div>
                        <form id="register-form">
                            <!-- SECTION 1: Personal Details -->
                            <div class="form-section">
                                <div class="section-title">
                                    <i class="bi bi-person-fill me-2"></i>Personal Details
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Full Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0">
                                            <i class="bi bi-person text-muted"></i>
                                        </span>
                                        <input type="text" class="form-control border-start-0" id="reg-name" required 
                                               placeholder="Enter your full name">
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0">
                                            <i class="bi bi-envelope text-muted"></i>
                                        </span>
                                        <input type="email" class="form-control border-start-0" id="reg-email" required
                                               placeholder="Enter your email">
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0">
                                            <i class="bi bi-lock text-muted"></i>
                                        </span>
                                        <input type="password" class="form-control border-start-0" id="reg-password" required
                                               placeholder="Minimum 6 characters" minlength="6">
                                        <span class="input-group-text bg-light border-start-0" onclick="togglePassword('reg-password', 'toggle-icon-1')">
                                            <i class="bi bi-eye text-muted" id="toggle-icon-1"></i>
                                        </span>
                                    </div>
                                    <div class="form-text">Password must be at least 6 characters</div>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Confirm Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0">
                                            <i class="bi bi-lock-fill text-muted"></i>
                                        </span>
                                        <input type="password" class="form-control border-start-0" id="reg-confirm-password" required
                                               placeholder="Re-enter your password">
                                    </div>
                                    <div class="invalid-feedback" id="password-match-error">
                                        Passwords do not match
                                    </div>
                                </div>
                            </div>

                            <!-- SECTION 2: Bank Account Setup -->
                            <div class="form-section">
                                <div class="section-title">
                                    <i class="bi bi-bank me-2"></i>Bank Account Setup
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Account Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0">
                                            <i class="bi bi-wallet2 text-muted"></i>
                                        </span>
                                        <input type="text" class="form-control border-start-0" id="reg-account-name" required
                                               placeholder="e.g. My Savings Account">
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Opening Balance (₹)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0">
                                            <i class="bi bi-currency-rupee text-muted"></i>
                                        </span>
                                        <input type="number" class="form-control border-start-0" id="reg-balance" required
                                               placeholder="Minimum ₹500" min="500" step="0.01">
                                    </div>
                                    <div class="form-text">This amount will be credited to your account immediately</div>
                                    <div class="form-text mt-1">
                                        <i class="bi bi-info-circle text-muted"></i>
                                        Minimum opening balance required: ₹500
                                    </div>
                                </div>
                            </div>

                            <div id="register-message" class="mb-3"></div>
                            
                            <button type="submit" class="btn btn-register w-100" id="register-btn">
                                <span class="btn-text">Create Account</span>
                                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            </button>
                        </form>
                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted mb-0">Already have an account? <a href="/login-page" class="fw-semibold">Sign in</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', function() {
            const userId = localStorage.getItem('user_id');
            if (userId) {
                const role = localStorage.getItem('role');
                if (role === 'admin') {
                    window.location.href = '/admin-dashboard';
                } else {
                    window.location.href = '/user-dashboard';
                }
            }
        });

        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye');
                toggleIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash');
                toggleIcon.classList.add('bi-eye');
            }
        }

        // Real-time password match validation
        document.getElementById('reg-confirm-password').addEventListener('input', function() {
            const password = document.getElementById('reg-password').value;
            const confirmPassword = this.value;
            const errorDiv = document.getElementById('password-match-error');
            
            if (confirmPassword && password !== confirmPassword) {
                this.classList.add('is-invalid');
            } else {
                this.classList.remove('is-invalid');
            }
        });

        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            const accountName = document.getElementById('reg-account-name').value;
            const balance = parseFloat(document.getElementById('reg-balance').value);
            
            const messageDiv = document.getElementById('register-message');
            const registerBtn = document.getElementById('register-btn');
            const btnText = registerBtn.querySelector('.btn-text');
            const spinner = registerBtn.querySelector('.spinner-border');
            
            // Validation
            if (!name || !email || !password || !confirmPassword || !accountName || !balance) {
                messageDiv.innerHTML = '<div class="alert alert-danger alert-dismissible fade show">All fields are required<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
                return;
            }
            
            if (password.length < 6) {
                messageDiv.innerHTML = '<div class="alert alert-danger alert-dismissible fade show">Password must be at least 6 characters<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
                return;
            }
            
            if (password !== confirmPassword) {
                messageDiv.innerHTML = '<div class="alert alert-danger alert-dismissible fade show">Passwords do not match<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
                return;
            }
            
            if (balance < 500) {
                messageDiv.innerHTML = '<div class="alert alert-danger alert-dismissible fade show">Opening balance must be at least ₹500<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
                return;
            }
            
            // Show loading state
            registerBtn.disabled = true;
            btnText.textContent = 'Creating Account...';
            spinner.classList.remove('d-none');
            messageDiv.innerHTML = '';
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: name,
                        email: email,
                        password: password,
                        account_name: accountName,
                        opening_balance: balance
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    messageDiv.innerHTML = '<div class="alert alert-success alert-dismissible fade show">Account created! Redirecting to login...<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
                    setTimeout(function() {
                        window.location.href = '/login-page';
                    }, 1500);
                } else {
                    messageDiv.innerHTML = '<div class="alert alert-danger alert-dismissible fade show">' + (result.error || 'Registration failed') + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="alert alert-danger alert-dismissible fade show">Connection error. Please try again.<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
            } finally {
                registerBtn.disabled = false;
                btnText.textContent = 'Create Account';
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
